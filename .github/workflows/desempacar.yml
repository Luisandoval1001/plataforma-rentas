name: Desempacar código

on:
  push:
    branches: [main]
    paths: ['codigo.dat']

permissions:
  contents: write

jobs:
  desempacar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer y publicar
        run: |
          set -euo pipefail
          mkdir /tmp/nuevo
          tar -xzf codigo.dat -C /tmp/nuevo
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/nuevo/. .
          git config user.name "Luisandoval1001"
          git config user.email "359274184+Luisandoval1001@users.noreply.github.com"
          git add -A
          git commit -m "Código de la plataforma"
          git push
